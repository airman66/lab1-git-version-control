name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить flake8
        run: pip install flake8
      - name: Проверка стиля flake8
        run: flake8 --max-line-length=100 --exclude=vendor .
      - name: Проверка синтаксиса
        run: python -m py_compile main.py utils.py report.py
      - name: Запуск main.py
        run: python main.py
